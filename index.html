<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackr.dev - Home</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-border: #6366f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            width: 95%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 50px;
            padding: 0.75rem 1rem;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 2rem;
            align-items: center;
            max-width: 95vw;
        }

        .nav-brand {
            padding: 0rem 0rem 0rem 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .nav-toggle {
            display: none;
            margin-left: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
        }

        .nav-toggle .hamburger,
        .nav-toggle .hamburger::before,
        .nav-toggle .hamburger::after {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-main);
            border-radius: 2px;
            position: relative;
        }
        .nav-toggle .hamburger::before,
        .nav-toggle .hamburger::after {
            content: '';
            position: absolute;
            left: 0;
            transition: transform 0.2s ease;
        }
        .nav-toggle .hamburger::before { top: -6px; }
        .nav-toggle .hamburger::after { top: 6px; }

        .nav-brand:hover {
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .nav-links a[aria-current="page"] {
            color: var(--text-main);
            font-weight: 700;
        }

        .nav-links a[aria-current="page"]::after {
            width: 100%;
            background: var(--accent-bright);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(to right, #6366f1, #a5b4fc);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .cta-button {
            margin-left: auto;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 5rem 2rem 2rem;
            text-align: center;
        }

        .hero-content {
            max-width: 1000px;
        }

        h1 {
            font-size: 5.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            line-height: 1.3;
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
            white-space: nowrap;
        }

        h1 .magnify-letter {
            display: inline-block;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            background-size: var(--title-width, 1000%) 100%;
            background-position: var(--letter-bg-pos, 0%) 0;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: scale(var(--letter-scale, 1));
            transform-origin: center bottom;
            transition: transform 0.12s ease-out;
            will-change: transform;
        }

        h1 .magnify-space {
            display: inline-block;
            white-space: pre;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
            opacity: 0;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
            opacity: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s ease;
            border: 1px solid rgba(99, 102, 241, 0.3);
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-3px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            } to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 1;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(99, 102, 241, 0.2) 30%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        .cursor-glow.hidden {
            opacity: 0;
        }

        .site-footer {
            padding: 1.5rem 1rem 2rem;
            color: #6b7280;
            font-size: 0.8rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            nav {
                padding: 0.6rem 1rem;
                gap: 1rem;
                max-width: 95vw;
            }

            .nav-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: calc(100% + 10px);
                left: 50%;
                transform: translateX(-50%);
                background: rgba(17,24,39,0.9);
                border-radius: 12px;
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
                min-width: min(90vw, 320px);
                box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                font-size: 0.95rem;
            }

            .nav-links li {
                list-style: none;
            }

            .cta-button {
                margin-left: 0.5rem;
            }

            .hero {
                padding: 4.5rem 1rem 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .hero-buttons {
                gap: 0.5rem;
            }

            .btn-primary, .btn-secondary {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-glow hidden"></div>

    <nav>
        <a href="index.html" class="nav-brand">jackr.dev</a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="hamburger"></span>
        </button>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
        </ul>
        <a href="contact.html" class="cta-button">Get in Touch</a>
    </nav>
    
    <section class="hero">
        <div class="hero-content">
            <h1 id="hero-title">Welcome to jackr.dev</h1>
            <p class="subtitle"><b><i>Computer Science & Mathematics</i></b> Student-Athlete at Gettysburg College</p>
            <div class="hero-buttons">
                <button class="btn-primary">View My Work</button>
                <a href="about.html" class="btn-secondary">Learn More</a>
            </div>
        </div>
    </section>

    <footer class="site-footer">© 2026 Jack Rogers</footer>

    <script>
        const heroTitle = document.querySelector('#hero-title');
        const titleText = heroTitle.textContent;
        const totalChars = titleText.length;

        heroTitle.replaceChildren(...[...titleText].map((character, index) => {
            const letter = document.createElement('span');
            letter.className = character === ' ' ? 'magnify-space' : 'magnify-letter';
            letter.textContent = character;

            const percent = totalChars > 1 ? (index / (totalChars - 1)) * 100 : 0;
            letter.style.setProperty('--letter-bg-pos', `${percent}%`);
            letter.style.setProperty('--title-width', `${totalChars * 100}%`);

            return letter;
        }));

        const titleLetters = [...heroTitle.querySelectorAll('.magnify-letter')];
        heroTitle.addEventListener('pointermove', (event) => {
            const radius = 150;

            titleLetters.forEach((letter) => {
                const bounds = letter.getBoundingClientRect();
                const distance = Math.hypot(
                    event.clientX - (bounds.left + bounds.width / 2),
                    event.clientY - (bounds.top + bounds.height / 2)
                );
                const intensity = Math.max(0, 1 - distance / radius);
                letter.style.setProperty('--letter-scale', 1 + intensity * 0.3);
            });
        });

        heroTitle.addEventListener('pointerleave', () => {
            titleLetters.forEach((letter) => letter.style.removeProperty('--letter-scale'));
        });

        const cursorGlow = document.querySelector('.cursor-glow');
        let mouseX = 0;
        let mouseY = 0;
        let isMoving = false;
        let moveTimeout;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            cursorGlow.style.left = mouseX + 'px';
            cursorGlow.style.top = mouseY + 'px';

            if (isMoving === false) {
                isMoving = true;
                cursorGlow.classList.remove('hidden');
            }

            clearTimeout(moveTimeout);

            moveTimeout = setTimeout(() => {
                isMoving = false;
                cursorGlow.classList.add('hidden');
            }, 1500);
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.add('hidden');
            isMoving = false;
            clearTimeout(moveTimeout);
        });

        document.addEventListener('mouseenter', () => {
            cursorGlow.classList.remove('hidden');
        });

        (function() {
            const toggle = document.querySelector('.nav-toggle');
            const links = document.querySelector('.nav-links');

            if (!toggle || !links) return;

            toggle.addEventListener('click', () => {
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', (!expanded).toString());
                links.classList.toggle('open');
            });

            document.addEventListener('click', (e) => {
                if (!links.classList.contains('open')) return;
                const target = e.target;
                if (!links.contains(target) && !toggle.contains(target)) {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && links.classList.contains('open')) {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>

</body>
</html>
