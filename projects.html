<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jackr.dev - Projects</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #111827;
            --surface-light: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #818cf8;
            --accent-bright: #a5b4fc;
            --accent-glow: rgba(99, 102, 241, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.14), transparent 32%),
                radial-gradient(circle at 85% 75%, rgba(45, 212, 191, 0.08), transparent 30%);
            pointer-events: none;
        }

        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            width: 95%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 2rem;
            max-width: 95vw;
            padding: 0.75rem 1rem;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            padding-left: 1rem;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-toggle { display: none; margin-left: auto; padding: 0.4rem; background: transparent; border: 0; cursor: pointer; }
        .hamburger, .hamburger::before, .hamburger::after { display: block; position: relative; width: 20px; height: 2px; background: var(--text-main); border-radius: 2px; }
        .hamburger::before, .hamburger::after { content: ''; position: absolute; left: 0; }
        .hamburger::before { top: -6px; }
        .hamburger::after { top: 6px; }

        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { position: relative; color: var(--text-muted); font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: all 0.3s ease; }
        .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--text-main); }
        .nav-links a[aria-current="page"] { font-weight: 700; }
        .nav-links a[aria-current="page"]::after { content: ''; position: absolute; right: 0; bottom: -4px; left: 0; height: 2px; background: var(--accent-bright); }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: linear-gradient(to right, #6366f1, #a5b4fc); transition: width 0.3s ease; }
        .nav-links a:hover::after { width: 100%; }

        .cta-button { margin-left: auto; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; padding: 0.6rem 1.4rem; border-radius: 9999px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }

        main { width: min(1100px, calc(100% - 2rem)); min-height: 100vh; margin: 0 auto; padding: 9rem 0 3rem; }
        .projects-header { max-width: 680px; margin-bottom: 2rem; animation: panelReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .eyebrow { margin-bottom: 0.5rem; color: var(--accent-bright); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .projects-header h1 {
            padding-bottom: 10px;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -0.04em;
        }
        .intro { margin-top: 1rem; color: var(--text-muted); font-size: 1.05rem; }

        .search-area { position: relative; z-index: 2; margin-bottom: 2rem; animation: panelReveal 0.8s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .search-box { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1.1rem; background: rgba(17, 24, 39, 0.88); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; box-shadow: 0 0 32px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
        .search-icon { color: var(--accent-bright); font-size: 2rem; line-height: 1; }
        .search-box input { width: 100%; color: var(--text-main); font: inherit; background: transparent; border: 0; outline: 0; }
        .search-box input::placeholder { color: var(--text-muted); }
        .tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; max-height: 0; margin-top: 0; overflow: visible; visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
        .tag-list.visible, .search-area:focus-within .tag-list { position: relative; z-index: 3; max-height: 160px; margin-top: 0.75rem; visibility: visible; opacity: 1; transition-delay: 0s; }
        .tag-button { padding: 0.4rem 0.75rem; color: var(--text-muted); font: inherit; font-size: 0.82rem; background: rgba(31, 41, 55, 0.8); border: 1px solid rgba(165, 180, 252, 0.2); border-radius: 999px; cursor: pointer; transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
        .tag-button:hover, .tag-button.active { color: var(--text-main); background: rgba(99, 102, 241, 0.25); border-color: var(--accent-bright); }

        .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .project-card { position: relative; display: flex; min-width: 0; aspect-ratio: 1 / 1; flex-direction: column; justify-content: flex-end; overflow: hidden; padding: 1.35rem; background: linear-gradient(145deg, rgba(17, 24, 39, 0.94), rgba(31, 41, 55, 0.82)); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 20px; box-shadow: 0 0 30px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08); animation: panelReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; transition: transform 0.25s ease, border-color 0.25s ease; }
        .project-card { cursor: pointer; }
        .project-card:hover { transform: translateY(-5px); border-color: rgba(165, 180, 252, 0.55); }
        .project-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; transition: transform 0.4s ease, opacity 0.3s ease; }
        .project-card:hover .project-image { transform: scale(1.05); opacity: 0.7; }
        .project-card::after { content: ''; position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, rgba(11, 15, 25, 0.98)); }
        .project-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent-bright); font-size: 4rem; font-weight: 800; background: radial-gradient(circle, rgba(99, 102, 241, 0.3), transparent 65%); }
        .project-content { position: relative; z-index: 1; }
        .project-title { margin-bottom: 0.35rem; font-size: 1.55rem; }
        .project-description { color: #d1d5db; font-size: 0.9rem; line-height: 1.45; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
        .project-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; }
        .project-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .project-tag { padding: 0.2rem 0.5rem; color: var(--accent-bright); font-size: 0.72rem; background: rgba(99, 102, 241, 0.16); border: 1px solid rgba(165, 180, 252, 0.25); border-radius: 999px; }
        .github-link { color: var(--text-main); font-size: 0.82rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .github-link:hover { color: var(--accent-bright); }
        .empty-state { grid-column: 1 / -1; padding: 3rem 1rem; color: var(--text-muted); text-align: center; border: 1px dashed rgba(156, 163, 175, 0.25); border-radius: 14px; }
        .site-footer { padding: 1.5rem 1rem 2rem; color: #6b7280; font-size: 0.8rem; text-align: center; }
        .project-modal { position: fixed; inset: 0; z-index: 1100; display: grid; place-items: center; padding: 2rem 1rem; background: rgba(5, 8, 15, 0.78); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .project-modal.open { opacity: 1; pointer-events: auto; }
        .modal-panel { position: relative; display: grid; width: min(960px, 100%); max-height: min(760px, 92vh); grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr); overflow: hidden; background: linear-gradient(145deg, rgba(17, 24, 39, 0.98), rgba(31, 41, 55, 0.96)); border: 1px solid rgba(165, 180, 252, 0.3); border-radius: 24px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 45px var(--accent-glow); transform: translateY(60px) scale(0.96); transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
        .project-modal.open .modal-panel { transform: translateY(0) scale(1); }
        .modal-media { position: relative; display: grid; min-height: 420px; place-items: center; overflow: hidden; background: rgba(11, 15, 25, 0.7); }
        .modal-image { width: 100%; height: 100%; object-fit: contain; }
        .modal-fallback { color: var(--accent-bright); font-size: clamp(5rem, 14vw, 9rem); font-weight: 800; }
        .modal-arrow, .modal-close { position: absolute; display: grid; place-items: center; color: var(--text-main); background: rgba(11, 15, 25, 0.72); border: 1px solid rgba(255, 255, 255, 0.16); cursor: pointer; }
        .modal-arrow { top: 50%; display: flex; width: 2.5rem; height: 2.5rem; align-items: center; justify-content: center; padding: 0 0 0.15em; border-radius: 50%; transform: translateY(-50%); font-size: 1.5rem; line-height: 1; }
        .modal-arrow:disabled { color: var(--text-muted); opacity: 0.45; cursor: not-allowed; }
        .modal-arrow:hover, .modal-close:hover { background: rgba(99, 102, 241, 0.7); }
        .modal-arrow.previous { left: 1rem; }
        .modal-arrow.next { right: 1rem; }
        .modal-close { top: 1rem; right: 1rem; z-index: 1; width: 2.25rem; height: 2.25rem; border-radius: 50%; font-size: 1.4rem; }
        .modal-details { display: flex; flex-direction: column; justify-content: center; padding: clamp(1.5rem, 4vw, 3rem); }
        .modal-details h2 { margin-bottom: 1rem; font-size: clamp(2rem, 4vw, 3rem); }
        .modal-description { color: #d1d5db; }
        .modal-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.5rem; }
        .modal-github { align-self: flex-start; margin-top: 2rem; color: var(--text-main); font-weight: 700; text-decoration: none; }
        .modal-github:hover { color: var(--accent-bright); }
        body.modal-open { overflow: hidden; }
        @keyframes panelReveal { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
        @media (max-width: 768px) {
            nav { gap: 1rem; padding: 0.6rem 1rem; }
            .nav-toggle { display: block; }
            .nav-links { display: none; position: absolute; top: calc(100% + 10px); left: 50%; min-width: min(90vw, 320px); flex-direction: column; gap: 0.75rem; padding: 0.75rem 1rem; background: rgba(17, 24, 39, 0.95); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); transform: translateX(-50%); }
            .nav-links.open { display: flex; }
            .cta-button { margin-left: 0.5rem; }
            main { padding-top: 7rem; }
            .project-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-panel { grid-template-columns: 1fr; max-height: 92vh; overflow-y: auto; }
            .modal-media { min-height: min(55vh, 420px); }
        }
        @media (max-width: 480px) { .project-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">jackr.dev</a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span class="hamburger"></span></button>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html" aria-current="page">Projects</a></li>
        </ul>
        <a href="contact.html" class="cta-button">Get in Touch</a>
    </nav>

    <main>
        <header class="projects-header">
            <p class="eyebrow">Selected work</p>
            <h1>Projects</h1>
            <p class="intro">A collection of things I have built, explored, and brought to life.</p>
        </header>

        <section class="search-area" aria-label="Search projects">
            <label class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="project-search" type="search" placeholder="Search My Projects" autocomplete="off">
            </label>
            <div id="tag-list" class="tag-list" aria-label="Filter by technology"></div>
        </section>

        <section id="project-grid" class="project-grid" aria-live="polite"></section>
    </main>

    <footer class="site-footer">© 2026 Jack Rogers</footer>

    <div id="project-modal" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-panel">
            <div class="modal-media">
                <button class="modal-close" type="button" aria-label="Close project details">×</button>
                <button class="modal-arrow previous" type="button" aria-label="Previous project image">‹</button>
                <span class="modal-fallback" aria-hidden="true"></span>
                <img class="modal-image" src="" alt="">
                <button class="modal-arrow next" type="button" aria-label="Next project image">›</button>
            </div>
            <div class="modal-details">
                <p class="eyebrow">Project details</p>
                <h2 id="modal-title"></h2>
                <p class="modal-description"></p>
                <div class="modal-tags"></div>
                <a class="modal-github" href="" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const toggle = document.querySelector('.nav-toggle');
            const links = document.querySelector('.nav-links');
            const search = document.querySelector('#project-search');
            const searchArea = document.querySelector('.search-area');
            const tagList = document.querySelector('#tag-list');
            const grid = document.querySelector('#project-grid');
            const modal = document.querySelector('#project-modal');
            const modalImage = modal.querySelector('.modal-image');
            const modalFallback = modal.querySelector('.modal-fallback');
            const modalTitle = modal.querySelector('#modal-title');
            const modalDescription = modal.querySelector('.modal-description');
            const modalTags = modal.querySelector('.modal-tags');
            const modalGithub = modal.querySelector('.modal-github');
            const modalPrevious = modal.querySelector('.modal-arrow.previous');
            const modalNext = modal.querySelector('.modal-arrow.next');
            let modalImages = [];
            let modalImageIndex = 0;
            let projects = [];
            let selectedTags = [];

            if (toggle && links) {
                toggle.addEventListener('click', () => {
                    const expanded = toggle.getAttribute('aria-expanded') === 'true';
                    toggle.setAttribute('aria-expanded', (!expanded).toString());
                    links.classList.toggle('open');
                });
                document.addEventListener('click', (event) => {
                    if (links.classList.contains('open') && !links.contains(event.target) && !toggle.contains(event.target)) {
                        links.classList.remove('open');
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape' && links.classList.contains('open')) {
                        links.classList.remove('open');
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            function imagePath(image) {
                if (!image) return '';
                if (image.startsWith('/images/')) return `projects/images/${image.slice('/images/'.length)}`;
                return image;
            }

            function projectImages(project) {
                const images = Array.isArray(project.images) ? project.images : (Array.isArray(project.image) ? project.image : [project.image]);
                return images.filter(Boolean).map(imagePath);
            }

            function updateModalImage() {
                const image = modalImages[modalImageIndex];
                modalImage.src = image || '';
                modalImage.hidden = !image;
                modalFallback.hidden = Boolean(image);
                const hasMultipleImages = modalImages.length > 1;
                modalPrevious.disabled = !hasMultipleImages;
                modalNext.disabled = !hasMultipleImages;
                modalPrevious.setAttribute('aria-disabled', (!hasMultipleImages).toString());
                modalNext.setAttribute('aria-disabled', (!hasMultipleImages).toString());
            }

            function closeModal() {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            function openModal(project) {
                if (!project) return;
                modalImages = projectImages(project);
                modalImageIndex = 0;
                modalTitle.textContent = project.title || 'Untitled project';
                modalDescription.textContent = project.description || '';
                modalFallback.textContent = (project.title || '?').charAt(0).toUpperCase();
                modalTags.innerHTML = (project.tags || []).map((tag) => `<span class="project-tag">${tag}</span>`).join('');
                modalGithub.href = project.github || '#';
                modalGithub.hidden = !project.github;
                updateModalImage();
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
                modal.querySelector('.modal-close').focus();
            }

            function renderTags(selectedOnly = false) {
                const tags = [...new Set(projects.flatMap((project) => project.tags || []))].sort();
                const visibleTags = selectedOnly ? tags.filter((tag) => selectedTags.includes(tag)) : tags;
                tagList.innerHTML = visibleTags.map((tag) => `<button class="tag-button${selectedTags.includes(tag) ? ' active' : ''}" type="button" data-tag="${tag}">${tag}</button>`).join('');
            }

            function renderProjects() {
                const query = search.value.trim().toLowerCase();
                const visible = projects.filter((project) => {
                    const searchable = [project.title, project.description, ...(project.tags || [])].join(' ').toLowerCase();
                    return searchable.includes(query) && selectedTags.every((tag) => (project.tags || []).includes(tag));
                });
                grid.innerHTML = visible.length ? visible.map((project, index) => {
                    const image = projectImages(project)[0];
                    const initial = (project.title || '?').charAt(0).toUpperCase();
                    const projectIndex = projects.indexOf(project);
                    return `<article class="project-card" tabindex="0" role="button" data-project-index="${projectIndex}" style="animation-delay: ${index * 0.06}s">
                        ${image ? `<img class="project-image" src="${image}" alt="" onerror="this.remove()">` : ''}
                        <span class="project-fallback" aria-hidden="true">${initial}</span>
                        <div class="project-content">
                            <h2 class="project-title">${project.title || 'Untitled project'}</h2>
                            <p class="project-description">${project.description || ''}</p>
                            <div class="project-footer">
                                <div class="project-tags">${(project.tags || []).map((tag) => `<span class="project-tag">${tag}</span>`).join('')}</div>
                                ${project.github ? `<a class="github-link" href="${project.github}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>` : ''}
                            </div>
                        </div>
                    </article>`;
                }).join('') : '<p class="empty-state">No projects match that search.</p>';
            }

            tagList.addEventListener('pointerdown', (event) => {
                const button = event.target.closest('[data-tag]');
                if (!button) return;
                event.preventDefault();
                const tag = button.dataset.tag;
                selectedTags = selectedTags.includes(tag) ? selectedTags.filter((selected) => selected !== tag) : [...selectedTags, tag];
                tagList.classList.add('visible');
                renderTags();
                renderProjects();
            });
            tagList.addEventListener('click', (event) => {
                event.stopPropagation();
            });
            grid.addEventListener('click', (event) => {
                const card = event.target.closest('[data-project-index]');
                if (event.target.closest('a')) return;
                if (card) openModal(projects[Number(card.dataset.projectIndex)]);
            });
            grid.addEventListener('keydown', (event) => {
                const card = event.target.closest('[data-project-index]');
                if (card && (event.key === 'Enter' || event.key === ' ')) {
                    event.preventDefault();
                    openModal(projects[Number(card.dataset.projectIndex)]);
                }
            });
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
            modalPrevious.addEventListener('click', () => { modalImageIndex = (modalImageIndex - 1 + modalImages.length) % modalImages.length; updateModalImage(); });
            modalNext.addEventListener('click', () => { modalImageIndex = (modalImageIndex + 1) % modalImages.length; updateModalImage(); });
            modalImage.addEventListener('error', () => {
                modalImage.hidden = true;
                modalFallback.hidden = false;
            });
            document.addEventListener('keydown', (event) => {
                if (!modal.classList.contains('open')) return;
                if (event.key === 'Escape') closeModal();
                if (event.key === 'ArrowLeft' && modalImages.length > 1) modalPrevious.click();
                if (event.key === 'ArrowRight' && modalImages.length > 1) modalNext.click();
            });
            search.addEventListener('input', renderProjects);
            searchArea.addEventListener('focusin', () => {
                tagList.classList.add('visible');
                renderTags();
            });
            searchArea.addEventListener('focusout', () => {
                window.setTimeout(() => {
                    if (searchArea.contains(document.activeElement)) return;
                    tagList.classList.toggle('visible', selectedTags.length > 0);
                    renderTags(selectedTags.length > 0);
                }, 0);
            });
            document.addEventListener('click', (event) => {
                if (searchArea.contains(event.target)) return;
                tagList.classList.toggle('visible', selectedTags.length > 0);
                renderTags(selectedTags.length > 0);
            });

            fetch('projects/projects.json')
                .then((response) => {
                    if (!response.ok) throw new Error('Could not load project data');
                    return response.json();
                })
                .then((data) => {
                    projects = Array.isArray(data) ? data : [];
                    renderTags();
                    renderProjects();
                })
                .catch(() => { grid.innerHTML = '<p class="empty-state">Project data could not be loaded.</p>'; });
        })();
    </script>
</body>
</html>
